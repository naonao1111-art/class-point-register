<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>积分记录管理 - 编辑与撤销</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #eef; }
        .edit-input { width: 200px; padding: 4px; }
        .save-btn, .revoke-btn { padding: 4px 10px; margin: 2px; border: none; border-radius: 4px; cursor: pointer; }
        .save-btn { background: #4CAF50; color: white; }
        .revoke-btn { background: #f44336; color: white; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #2196F3; text-decoration: none; }
        .filter-group { margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
        .login-area { background: #f0f2f5; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .login-area input { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; width: 200px; }
        .login-area button { padding: 6px 12px; background: #2196F3; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .status-bar { position: sticky; top: 0; z-index: 999; display: none; padding: 10px 16px; margin-bottom: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; background: #fff3cd; color: #856404; border: 1px solid #ffe69c; }
        .status-bar.busy { display: block; background: #fff3cd; color: #856404; border-color: #ffe69c; }
        .status-bar.ok { display: block; background: #d4edda; color: #155724; border-color: #c3e6cb; }
        .status-bar.err { display: block; background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="container" id="loginPanel">
    <h2>管理员登录</h2>
    <div class="login-area">
        <label>后台密码: </label>
        <input type="password" id="adminPwd" placeholder="密码">
        <button id="loginBtn">登录</button>
        <p id="loginMsg" class="error"></p>
    </div>
</div>

<div class="container" id="mainPanel" style="display:none;">
    <a href="admin.html" class="back-link">← 返回管理后台</a>
    <h1>积分变化记录管理</h1>
    <p>可直接修改记录的「原因」和「分数」；修改分数会自动同步学生积分。撤销记录均需要管理员密码。修改即时保存，<strong>无需刷新页面</strong>；关闭页面后再打开即为最新数据。</p>
    <div id="statusBar" class="status-bar"></div>

    <div class="filter-group">
        <input type="text" id="filterText" placeholder="学号/姓名/原因关键词" style="width: 250px;">
        <button id="filterBtn">筛选</button>
        <button id="resetFilterBtn">重置</button>
        <button id="revokeSelectedBtn" style="background:#f44336; color:white; margin-left:10px;">撤销选中记录</button>
    </div>

    <div style="margin: 15px 0; background: #f9f9f9; padding: 10px; border-radius: 5px;">
        <strong>批量替换原因关键词：</strong>
        <input type="text" id="findText" placeholder="查找文本" style="width: 150px; padding: 5px;">
        <input type="text" id="replaceText" placeholder="替换为" style="width: 150px; padding: 5px;">
        <button id="replaceBtn" style="background: #ff9800; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer;">替换</button>
        <span id="replaceMsg" style="margin-left: 10px;"></span>
    </div>

    <div style="overflow-x:auto;">
        <table id="reasonsManageTable">
            <thead>
                <tr><th>时间</th><th>学号</th><th>姓名</th><th>分数变化</th><th>原因</th><th>操作</th>
                </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // ========== 配置与常量 ==========
    const REPO_OWNER = "naonao1111-art";
    const REPO_NAME = "class-point-register";
    const DATA_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data.json`;
    const REASONS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/reasons.json`;
    const EDIT_TRACES_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/edit_traces.json`;
    // 密码哈希统一从仓库 config_encoded.json 的 admin_password_hash 读取，不在页面中硬编码

    let allReasons = [];
    let currentStudents = [];
    let filteredReasons = [];
    let currentEditTraces = [];
    let CONFIG = { github_token: "" };

    // ========== 工具函数 ==========
    function base64DecodeToUtf8(base64Str) {
        const binaryStr = atob(base64Str);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }
    function utf8ToBase64(str) {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        let binary = '';
        for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
        return btoa(binary);
    }
    async function sha256(message) {
        const encoder = new TextEncoder();
        const data = encoder.encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function decodeToken(obf) {
        if (!obf) return "";
        const reversed = obf.split('').reverse().join('');
        const shifted = atob(reversed);
        return shifted.split('').map(c => String.fromCharCode(c.charCodeAt(0)-1)).join('');
    }

    async function loadConfig() {
        const resp = await fetch("https://naonao1111-art.github.io/class-point-register/config_encoded.json?t="+Date.now());
        if (resp.ok) {
            const config = await resp.json();
            CONFIG.github_token = decodeToken(config.github_token_obfuscated || "");
            CONFIG.admin_password_hash = config.admin_password_hash || "";
        }
    }

    async function fetchJSON(url) {
        const headers = CONFIG.github_token ? { Authorization: `token ${CONFIG.github_token}` } : {};
        const timestamp = Date.now();
        const sep = url.includes('?') ? '&' : '?';
        const resp = await fetch(url + sep + 't=' + timestamp, { headers, cache: 'no-store' });
        if (resp.status === 404) return null;
        const data = await resp.json();
        return JSON.parse(base64DecodeToUtf8(data.content));
    }
    async function saveJSON(url, content, message) {
        let sha = null;
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${CONFIG.github_token}` } });
            if (res.ok) sha = (await res.json()).sha;
        } catch(e) {}
        const payload = { message, content: utf8ToBase64(JSON.stringify(content, null, 2)), sha };
        const resp = await fetch(url, {
            method: "PUT",
            headers: { Authorization: `token ${CONFIG.github_token}`, "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error("保存失败");
    }

    // ========== 修改痕迹（记录在 edit_traces.json，仅管理后台展示，公开展示页面不读取）==========
    function getBeijingNow() {
        const now = new Date();
        const utc = now.getTime() + now.getTimezoneOffset() * 60000;
        return new Date(utc + 8 * 3600000);
    }
    function formatBeijingTime(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        const s = String(d.getSeconds()).padStart(2, '0');
        return `${y}-${m}-${day} ${h}:${min}:${s}`;
    }
    async function loadTraces() {
        const res = await fetchJSON(EDIT_TRACES_URL);
        currentEditTraces = (res && res.traces) ? res.traces : [];
    }
    async function saveTraces() {
        await saveJSON(EDIT_TRACES_URL, { traces: currentEditTraces }, "记录修改痕迹");
    }
    function addTrace(action, studentIds, detail) {
        currentEditTraces.push({
            timestamp: formatBeijingTime(getBeijingNow()),
            action: action,
            studentIds: studentIds || [],
            detail: detail || ""
        });
        // 最多保留 500 条，防止文件无限膨胀
        if (currentEditTraces.length > 500) currentEditTraces = currentEditTraces.slice(-500);
    }

    // ========== 全局状态提示条（修改时提示“正在修改”，避免用户误以为没反应）==========
    function showStatus(text, type) {
        const bar = document.getElementById("statusBar");
        if (!bar) return;
        bar.className = "status-bar " + (type || "busy");
        bar.innerText = text;
        if (type === "ok" || type === "err") {
            clearTimeout(showStatus._timer);
            showStatus._timer = setTimeout(() => { bar.className = "status-bar"; }, 6000);
        }
    }

    // ========== 数据加载 ==========
    async function loadData() {
        const data = await fetchJSON(DATA_URL);
        currentStudents = (data?.students || []).map(s => ({ ...s, score: parseFloat(s.score) }));
        const reasons = await fetchJSON(REASONS_URL);
        allReasons = reasons || [];
        for (let i = 0; i < allReasons.length; i++) {
            if (!allReasons[i].id) {
                allReasons[i].id = `${allReasons[i].timestamp}_${allReasons[i].studentId}_${allReasons[i].delta}`;
            }
        }
        filteredReasons = [...allReasons];
    }

    // ========== 合并与渲染 ==========
    function mergeReasons(reasons) {
        const groups = {};
        reasons.forEach(r => {
            const key = `${r.timestamp}|${r.delta}|${r.reason}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(r);
        });
        const merged = [];
        for (let key in groups) {
            const items = groups[key];
            merged.push({
                ids: items.map(r => r.studentId),
                names: items.map(r => r.studentName),
                delta: items[0].delta,
                reason: items[0].reason,
                timestamp: items[0].timestamp,
                records: items
            });
        }
        return merged;
    }

    let mergedGroups = [];

    function renderTable() {
        const tbody = document.querySelector("#reasonsManageTable tbody");
        tbody.innerHTML = "";
        mergedGroups = mergeReasons(filteredReasons);
        const sorted = mergedGroups.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        sorted.forEach(g => {
            const row = tbody.insertRow();
            row.insertCell(0).innerText = g.timestamp;
            row.insertCell(1).innerText = g.ids.join('、');
            row.insertCell(2).innerText = g.names.join('、');
            const deltaCell = row.insertCell(3);
            const inputDelta = document.createElement("input");
            inputDelta.type = "number";
            inputDelta.step = "any";
            inputDelta.value = g.delta;
            inputDelta.style.width = "80px";
            inputDelta.className = "edit-input";
            deltaCell.appendChild(inputDelta);
            const reasonCell = row.insertCell(4);
            const inputReason = document.createElement("input");
            inputReason.type = "text";
            inputReason.value = g.reason;
            inputReason.style.width = "200px";
            inputReason.className = "edit-input";
            reasonCell.appendChild(inputReason);
            const btnCell = row.insertCell(5);
            const saveBtn = document.createElement("button");
            saveBtn.innerText = "保存修改";
            saveBtn.className = "save-btn";
            saveBtn.onclick = () => saveGroupChanges(g, inputReason.value, inputDelta.value, saveBtn);
            btnCell.appendChild(saveBtn);
            const chk = document.createElement("input");
            chk.type = "checkbox";
            chk.className = "group-checkbox";
            chk.dataset.ids = JSON.stringify(g.records.map(r => r.id));
            btnCell.appendChild(chk);
            btnCell.appendChild(document.createTextNode("选择"));
        });
    }

    async function saveGroupChanges(group, newReason, newDeltaStr, btn) {
        if (!newReason || !newReason.trim()) {
            showStatus("原因不能为空", "err");
            return;
        }
        const newDelta = parseFloat(newDeltaStr);
        if (isNaN(newDelta) || newDelta === 0) {
            showStatus("请输入有效的分数变化（非0）", "err");
            return;
        }
        const oldReason = group.records[0].reason;
        const oldDelta = group.records[0].delta;
        const reasonChanged = newReason.trim() !== oldReason;
        const deltaChanged = newDelta !== oldDelta;
        if (!reasonChanged && !deltaChanged) {
            showStatus("没有需要保存的修改", "err");
            return;
        }

        // 备份，保存失败时恢复
        const backupStudents = JSON.parse(JSON.stringify(currentStudents));
        const backupReasons = JSON.parse(JSON.stringify(allReasons));
        const backupTraces = JSON.parse(JSON.stringify(currentEditTraces));

        // 应用修改：原因 + 分数
        for (let r of group.records) {
            r.reason = newReason.trim();
            if (deltaChanged) {
                const student = currentStudents.find(s => s.id === r.studentId);
                if (student) {
                    student.score = parseFloat((student.score - oldDelta + newDelta).toFixed(2));
                }
                r.delta = newDelta;
            }
        }

        // 记录修改痕迹
        const ids = group.records.map(r => r.studentId);
        const changeParts = [];
        if (reasonChanged) changeParts.push(`原因："${oldReason}" → "${newReason.trim()}"`);
        if (deltaChanged) changeParts.push(`分数：${(oldDelta>0?"+":"")+oldDelta} → ${(newDelta>0?"+":"")+newDelta}`);
        addTrace("编辑记录", ids, changeParts.join("；") + `（共${group.records.length}条记录）`);

        showStatus("正在保存修改…请稍候，不要重复操作", "busy");
        if (btn) btn.disabled = true;
        try {
            if (deltaChanged) {
                await saveJSON(DATA_URL, { students: currentStudents }, "修改记录分数调整");
            }
            await saveJSON(REASONS_URL, allReasons, "编辑原因/分数");
            await saveTraces();
            showStatus("已保存，无需刷新页面（关闭页面后其他页面打开即为最新数据）", "ok");
            renderTable();
        } catch(err) {
            // 保存失败：回滚内存修改，避免页面与仓库不一致
            currentStudents = backupStudents;
            allReasons = backupReasons;
            currentEditTraces = backupTraces;
            renderTable();
            showStatus("保存失败：" + err.message + "，已恢复原状，请重试", "err");
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    // ========== 筛选 ==========
    function applyFilter() {
        const keyword = document.getElementById("filterText").value.trim().toLowerCase();
        if (!keyword) filteredReasons = [...allReasons];
        else {
            filteredReasons = allReasons.filter(r =>
                r.studentId.toLowerCase().includes(keyword) ||
                r.studentName.toLowerCase().includes(keyword) ||
                r.reason.toLowerCase().includes(keyword)
            );
        }
        renderTable();
    }

    // ========== 批量撤销 ==========
    document.getElementById("revokeSelectedBtn").onclick = async () => {
        const revokeBtn = document.getElementById("revokeSelectedBtn");
        const checkboxes = document.querySelectorAll(".group-checkbox:checked");
        if (checkboxes.length === 0) {
            showStatus("请至少选择一条记录", "err");
            return;
        }
        let allIds = [];
        checkboxes.forEach(cb => {
            const ids = JSON.parse(cb.dataset.ids);
            allIds = allIds.concat(ids);
        });
        if (allIds.length === 0) return;
        if (!confirm(`确定撤销选中的 ${allIds.length} 条记录吗？`)) return;

        // 先备份，保存失败时恢复
        const backupStudents = JSON.parse(JSON.stringify(currentStudents));
        const backupReasons = JSON.parse(JSON.stringify(allReasons));
        const backupTraces = JSON.parse(JSON.stringify(currentEditTraces));

        const revokedRecords = [];
        for (let id of allIds) {
            const record = allReasons.find(r => r.id === id);
            if (!record) continue;
            revokedRecords.push(record);
            const student = currentStudents.find(s => s.id === record.studentId);
            if (student) {
                student.score -= record.delta;
                student.score = parseFloat(student.score.toFixed(2));
            }
        }
        allReasons = allReasons.filter(r => !allIds.includes(r.id));
        filteredReasons = [...allReasons];

        // 记录修改痕迹
        const revokedIds = revokedRecords.map(r => r.studentId);
        const revokedDeltas = [...new Set(revokedRecords.map(r => r.delta))].map(d => (d>0?"+":"")+d).join('、');
        addTrace("撤销记录", revokedIds, `撤销 ${revokedRecords.length} 条记录（分数变化：${revokedDeltas}），已恢复学生积分`);

        showStatus(`正在撤销 ${allIds.length} 条记录…请稍候，不要重复操作`, "busy");
        if (revokeBtn) revokeBtn.disabled = true;
        try {
            await saveJSON(DATA_URL, { students: currentStudents }, "撤销操作恢复分数");
            await saveJSON(REASONS_URL, allReasons, "撤销操作删除记录");
            await saveTraces();
            showStatus(`已撤销 ${allIds.length} 条记录，数据已保存，无需刷新页面`, "ok");
            renderTable();
        } catch(err) {
            // 恢复内存数据，保持与仓库一致
            currentStudents = backupStudents;
            allReasons = backupReasons;
            currentEditTraces = backupTraces;
            filteredReasons = [...allReasons];
            renderTable();
            showStatus("撤销失败：" + err.message + "，已恢复原状，请重试", "err");
        } finally {
            if (revokeBtn) revokeBtn.disabled = false;
        }
    };

    // ========== 批量替换原因 ==========
    document.getElementById("replaceBtn").onclick = async () => {
        const replaceBtn = document.getElementById("replaceBtn");
        const find = document.getElementById("findText").value.trim();
        const replace = document.getElementById("replaceText").value;
        if (!find) { showStatus("请输入要查找的文本", "err"); return; }
        if (!confirm(`确定要将所有原因中的 "${find}" 替换为 "${replace}" 吗？`)) return;
        const backupReasons = JSON.parse(JSON.stringify(allReasons));
        const backupTraces = JSON.parse(JSON.stringify(currentEditTraces));
        let count = 0;
        for (let r of allReasons) {
            if (r.reason.includes(find)) {
                r.reason = r.reason.replaceAll(find, replace);
                count++;
            }
        }
        if (count === 0) {
            document.getElementById("replaceMsg").innerText = "未找到匹配项";
            return;
        }
        // 记录修改痕迹
        addTrace("批量替换", [], `原因中包含 "${find}" 的 ${count} 条记录，全部替换为 "${replace}"`);
        showStatus(`正在替换 ${count} 条记录…请稍候，不要重复操作`, "busy");
        if (replaceBtn) replaceBtn.disabled = true;
        try {
            await saveJSON(REASONS_URL, allReasons, "批量替换原因关键词");
            await saveTraces();
            document.getElementById("replaceMsg").innerText = `成功替换 ${count} 条记录`;
            showStatus(`已替换 ${count} 条记录，数据已保存，无需刷新页面`, "ok");
            renderTable();
        } catch(err) {
            allReasons = backupReasons;
            currentEditTraces = backupTraces;
            filteredReasons = [...allReasons];
            document.getElementById("replaceMsg").innerText = "";
            renderTable();
            showStatus("保存失败：" + err.message + "，已恢复原状，请重试", "err");
        } finally {
            if (replaceBtn) replaceBtn.disabled = false;
        }
    };

    // ========== 登录 ==========
    document.getElementById("loginBtn").onclick = async () => {
        await loadConfig();
        const pwd = document.getElementById("adminPwd").value;
        const pwdHash = await sha256(pwd);
        if (!CONFIG.admin_password_hash) {
            document.getElementById("loginMsg").innerText = "无法从仓库读取密码配置，请检查 config_encoded.json";
            return;
        }
        if (pwdHash !== CONFIG.admin_password_hash) {
            document.getElementById("loginMsg").innerText = "密码错误";
            return;
        }
        if (!CONFIG.github_token) {
            document.getElementById("loginMsg").innerText = "无法读取Token，请检查配置";
            return;
        }
        try {
            await loadData();
            await loadTraces();
            document.getElementById("loginPanel").style.display = "none";
            document.getElementById("mainPanel").style.display = "block";
            renderTable();
            document.getElementById("filterBtn").onclick = applyFilter;
            document.getElementById("resetFilterBtn").onclick = () => {
                document.getElementById("filterText").value = "";
                filteredReasons = [...allReasons];
                renderTable();
            };
        } catch(err) {
            document.getElementById("loginMsg").innerText = "加载数据失败：" + err.message;
        }
    };
</script>
    <script src="auto_inc.js"></script>
    <script>
        if (typeof checkAndRunAutoIncrement === 'function') {
            checkAndRunAutoIncrement();
        }
    </script>
</body>
</html>
