    <script>
        // ============================================================
        // 1. 配置与常量
        // ============================================================
        const REPO_OWNER = "naonao1111-art";
        const REPO_NAME = "class-point-register";
        const DATA_FILE = "data.json";
        const REASONS_FILE = "reasons.json";
        const RULES_FILE = "rules.json";
        const CLASS_FILE = "class_committee.json";
        const RATINGS_FILE = "committee_ratings.json";
                const DATA_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`;
        const REASONS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REASONS_FILE}`;
        const RULES_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${RULES_FILE}`;
        const CLASS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CLASS_FILE}`;
        const RATINGS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${RATINGS_FILE}`;
                const ADMIN_PASSWORD_HASH = "621afced69a8a7037d5576facd2b9ae488da1988b6f847fb6f6e724f734eb30c";

        let currentStudents = [];
        let currentReasons = [];
        let currentRules = [];
        let dataSha = "";
        let reasonsSha = "";
        let selectedStudentId = null;
        let currentSort = { field: 'id', order: 'asc' };
        let autoTracker = { stopped: false, lowScoreStudents: {}, lastSundayBonus: 0 };
        
        // ============================================================
        // 2. 工具函数
        // ============================================================
        function decodeToken(obfuscated) {
            try {
                if (!obfuscated) return "";
                const reversed = obfuscated.split('').reverse().join('');
                const shifted = atob(reversed);
                return shifted.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 1)).join('');
            } catch (e) {
                console.error("Token 解码失败", e);
                return "";
            }
        }

        function formatBeijingTime(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            return `${y}-${m}-${day} ${h}:${min}:${s}`;
        }

        function getWeekNumber(d) {
            d = new Date(d);
            d.setHours(0,0,0,0);
            const day = d.getDay() || 7;
            const diff = day - 1;
            const monday = new Date(d);
            monday.setDate(d.getDate() - diff);
            const startOfYear = new Date(monday.getFullYear(), 0, 1);
            const days = Math.floor((monday - startOfYear) / (24*60*60*1000));
            const weekNumber = Math.ceil((days + 1) / 7);
            return monday.getFullYear() + "-W" + String(weekNumber).padStart(2, '0');
        }

        // 北京时间相关
        function getBeijingNow() {
            const now = new Date();
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            return new Date(utc + 8 * 3600000);
        }
        function getBeijingDateStr(d) {
            d = d || getBeijingNow();
            return d.toISOString().slice(0,10);
        }
        function getBeijingWeekday(d) {
            d = d || getBeijingNow();
            return d.getDay(); // 0=周日
        }

        // 计算低分补分开始日期
        function calculateStartDate(modifyBeijingDate) {
            const hour = modifyBeijingDate.getHours();
            const minute = modifyBeijingDate.getMinutes();
            const totalMinutes = hour * 60 + minute;
            const start = new Date(modifyBeijingDate);
            if (totalMinutes <= 21 * 60) { // 21:00之前
                start.setDate(start.getDate() + 1);
            } else {
                start.setDate(start.getDate() + 2);
            }
            start.setHours(0,0,0,0);
            return start.toISOString().slice(0,10);
        }

        // ============================================================
        // 3. 网络请求与认证
        // ============================================================
        let CONFIG = { github_token: "" };
        async function loadConfig() {
            try {
                const resp = await fetch(
                    "https://naonao1111-art.github.io/class-point-register/config_encoded.json?t=" + Date.now(),
                    { cache: "no-store" }
                );
                if (resp.ok) {
                    const config = await resp.json();
                    CONFIG = {
                        admin_password_hash: config.admin_password_hash || "",
                        github_token: decodeToken(config.github_token_obfuscated || "")
                    };
                }
            } catch (e) {
                console.error("加载配置失败", e);
            }
        }

        async function sha256(message) {
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function base64DecodeToUtf8(base64Str) {
            const binaryStr = atob(base64Str);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }
        function utf8ToBase64(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            let binary = '';
            for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
            return btoa(binary);
        }

        async function fetchJSON(url) {
            const tokenStr = CONFIG.github_token;
            const headers = tokenStr ? { Authorization: `token ${tokenStr}` } : {};
            const resp = await fetch(url, { headers });
            if (resp.status === 404) return { content: null, sha: null };
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const content = JSON.parse(base64DecodeToUtf8(data.content));
            return { content, sha: data.sha };
        }

        async function saveJSON(url, content, message) {
            let sha = null;
            try {
                const tokenStr = CONFIG.github_token;
                const headers = tokenStr ? { Authorization: `token ${tokenStr}` } : {};
                const resp = await fetch(url, { headers });
                if (resp.ok) {
                    const data = await resp.json();
                    sha = data.sha;
                }
            } catch(e) {}
            const jsonStr = JSON.stringify(content, null, 2);
            const newContent = utf8ToBase64(jsonStr);
            const payload = { message, content: newContent };
            if (sha) payload.sha = sha;
            const tokenStr = CONFIG.github_token;
            const resp = await fetch(url, {
                method: "PUT",
                headers: { Authorization: `token ${tokenStr}`, "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!resp.ok) {
                const errText = await resp.text();
                throw new Error(`保存失败 HTTP ${resp.status}: ${errText}`);
            }
            const result = await resp.json();
            return result.content.sha;
        }

        // ============================================================
        // 4. 数据加载与保存
        // ============================================================
        async function loadAllData() {
            const dataRes = await fetchJSON(DATA_URL);
            if (dataRes.content) {
                currentStudents = (dataRes.content.students || []).map(s => ({ ...s, score: parseFloat(s.score) }));
                dataSha = dataRes.sha;
            } else {
                currentStudents = [];
                dataSha = null;
            }
            const reasonsRes = await fetchJSON(REASONS_URL);
            if (reasonsRes.content) {
                currentReasons = reasonsRes.content;
                reasonsSha = reasonsRes.sha;
            } else {
                currentReasons = [];
                reasonsSha = null;
            }
            const rulesRes = await fetchJSON(RULES_URL);
            if (rulesRes.content && rulesRes.content.rules) {
                currentRules = rulesRes.content.rules;
            } else {
                currentRules = [];
            }
        }

        async function saveStudents() {
            const newData = { students: currentStudents };
            dataSha = await saveJSON(DATA_URL, newData, "更新学生数据");
        }
        async function saveReasons() {
            reasonsSha = await saveJSON(REASONS_URL, currentReasons, "更新原因记录");
        }

        // ============================================================
        // 5. 界面渲染
        // ============================================================
        function sortStudents(students, field, order) {
            const sorted = [...students];
            sorted.sort((a, b) => {
                let valA = a[field];
                let valB = b[field];
                if (field === 'score') {
                    valA = parseFloat(valA);
                    valB = parseFloat(valB);
                    if (valA < valB) return order === 'asc' ? -1 : 1;
                    if (valA > valB) return order === 'asc' ? 1 : -1;
                    return 0;
                } else {
                    valA = String(valA);
                    valB = String(valB);
                    const compareResult = valA.localeCompare(valB, 'zh-CN');
                    return order === 'asc' ? compareResult : -compareResult;
                }
            });
            return sorted;
        }

        function renderStudentsTable() {
            const tbody = document.querySelector("#stuTable tbody");
            tbody.innerHTML = "";
            const sorted = sortStudents(currentStudents, currentSort.field, currentSort.order);
            sorted.forEach(s => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = s.id;
                row.insertCell(1).innerText = s.name;
                row.insertCell(2).innerText = (typeof s.score === 'number' ? s.score.toFixed(2) : s.score);
                const chkCell = row.insertCell(3);
                const chk = document.createElement("input");
                chk.type = "checkbox";
                chk.className = "student-checkbox";
                chk.value = s.id;
                chkCell.appendChild(chk);
                const actionCell = row.insertCell(4);
                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = "selectedStu";
                radio.value = s.id;
                radio.onclick = () => {
                    selectedStudentId = s.id;
                    document.getElementById("stuId").value = s.id;
                    document.getElementById("stuName").value = s.name;
                    document.getElementById("stuScore").value = s.score;
                };
                actionCell.appendChild(radio);
                actionCell.appendChild(document.createTextNode(" 选中"));
            });
        }

        function renderRulesList() {
            const container = document.getElementById("rulesList");
            if (!container) return;
            if (currentRules.length === 0) {
                container.innerHTML = '<p>暂无积分规则，请先在“管理积分规则”中添加。</p>';
                return;
            }
            const addRules = currentRules.filter(r => r.score > 0);
            const subRules = currentRules.filter(r => r.score < 0);
            let html = '<div><strong>加分</strong><br/>';
            addRules.forEach(r => {
                html += `<span class="rule-tag" data-score="${r.score}" data-action="${escapeHtml(r.action)}">${escapeHtml(r.action)} +${r.score}</span> `;
            });
            html += '</div><div style="margin-top:6px;"><strong>减分</strong><br/>';
            subRules.forEach(r => {
                html += `<span class="rule-tag" data-score="${r.score}" data-action="${escapeHtml(r.action)}">${escapeHtml(r.action)} ${r.score}</span> `;
            });
            html += '</div>';
            container.innerHTML = html;
            document.querySelectorAll('.rule-tag').forEach(el => {
                el.addEventListener('click', () => {
                    const score = parseFloat(el.getAttribute('data-score'));
                    const action = el.getAttribute('data-action');
                    document.getElementById('quickDelta').value = score;
                    document.getElementById('quickReason').value = action;
                });
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ============================================================
        // 7. 积分保护计算
        // ============================================================
        function calculateProtectedDelta(currentScore, delta) {
            if (delta === 0) return { actualDelta: 0, remark: ""};
            const T1 = -30, T2 = -38, T3 = -45;
            let actualDelta = delta;
            let remark = "";
            let temporery3 = currentScore - T3;
            let temporery2 = currentScore - T2;
            let temporery1 = currentScore - T1;
            if (delta > 0) {
                if (currentScore <= T3 && currentScore + delta * 1.35 > T3) {
                    delta = delta + temporery3 / 1.35;
                    actualDelta = delta * 1.25 - temporery3; remark = "( 分界运算 )"
                }else if (currentScore <= T3) {
                    actualDelta = delta * 1.35; remark = " (低于-45)";
                }else if (currentScore <= T2 && currentScore + delta * 1.2 > T2) {
                    delta = delta + temporery2 / 1.2;
                    actualDelta = delta * 1.1 - temporery2 ; remark = "( 分界运算 )";
                }else if (currentScore <= T2) {
                    actualDelta = delta * 1.2; remark = " (低于-38)";
                }else if (currentScore <= T1  && currentScore + delta * 1.1 > T1) {
                    delta = delta + temporery1  / 1.1;
                    actualDelta = delta - temporery1 ; remark = "( 分界运算 )";
                }else if (currentScore <= T1) {
                    actualDelta = delta * 1.1; remark = " (低于-30)";
                }
            } else if (delta < 0) {
                if (currentScore <= T3) {
                    actualDelta = delta / 1.5; remark = " (低于-45)";
                }else if (currentScore <= T2 && currentScore + delta/ 1.25 <= T3) {
                    delta = delta + temporery3 * 1.25;
                    actualDelta = delta / 1.5 - temporery3; remark = "( 分界运算 )"
                }else if (currentScore <= T2) {
                    actualDelta = delta / 1.25; remark = " (低于-38)";
                }else if (currentScore <= T1 && currentScore + delta / 1.12 <= T2) {
                    delta = delta + temporery2 * 1.12;
                    actualDelta = delta / 1.25 - temporery2; remark = "( 分界运算 )";
                }else if (currentScore <= T1) {
                    actualDelta = delta / 1.12; remark = " (低于-30)";
                }else if (currentScore > T1 && currentScore + delta  <= T1) {
                    delta = delta + temporery1 ;
                    actualDelta = delta / 1.12 - temporery1 ; remark = "( 分界运算 )";
                }
            }
            return { actualDelta, remark };
        }

        // ============================================================
        // 8. 应用积分到选中学生（批量加减分）
        // ============================================================
        async function applyToCheckedStudents() {
            const checkboxes = document.querySelectorAll(".student-checkbox:checked");
            if (checkboxes.length === 0) {
                alert("请至少勾选一名学生");
                return;
            }
            const delta = parseFloat(document.getElementById("quickDelta").value);
            if (isNaN(delta) || delta === 0) {
                alert("请输入有效的分数变化（非0）");
                return;
            }
            let reason = document.getElementById("quickReason").value.trim();
            if (!reason) {
                alert("请输入原因");
                return;
            }

            const updates = [];
            for (let chk of checkboxes) {
                const sid = chk.value;
                const student = currentStudents.find(s => s.id === sid);
                if (!student) continue;
                const oldScore = student.score;
                const { actualDelta, remark } = calculateProtectedDelta(student.score, delta);
                if (actualDelta === 0) continue;
                let newScore = student.score + actualDelta;
                newScore = Math.min(10000000, Math.max(-10000000, newScore));
                if (newScore !== student.score) {
                    updates.push({ student, newScore, actualDelta, remark, oldScore });
                }
            }

            if (updates.length === 0) {
                alert("所选学生积分均无变化（已达上限或下限或无需调整）");
                return;
            }
            for (let u of updates) u.student.score = u.newScore;
            await saveStudents();

            // 使用北京时间
            const beijingNow = getBeijingNow();
            const timestamp = formatBeijingTime(beijingNow);

            const newRecords = updates.map(u => ({
                timestamp: timestamp,
                studentId: u.student.id,
                studentName: u.student.name,
                delta: u.actualDelta,
                reason: reason + u.remark
            }));

            currentReasons.push(...newRecords);
            await saveReasons();

            // 检查是否触发低分补分（从 >=-50 变为 <-50）
            let lowScoreTriggered = false;
            for (let u of updates) {
                if (u.oldScore >= -50 && u.newScore < -50) {
                    const startDate = calculateStartDate(beijingNow);
                    if (!autoTracker.lowScoreStudents) autoTracker.lowScoreStudents = {};
                    if (!autoTracker.lowScoreStudents[u.student.id]) {
                        autoTracker.lowScoreStudents[u.student.id] = { 
                            startDate: startDate, 
                            daysAdded: 0,
                            enabled: true
                        };
                    } else {
                        autoTracker.lowScoreStudents[u.student.id].startDate = startDate;
                        autoTracker.lowScoreStudents[u.student.id].daysAdded = 0;
                        autoTracker.lowScoreStudents[u.student.id].enabled = true;
                    }
                    lowScoreTriggered = true;
                }
            }
            if (lowScoreTriggered) {
                await saveAutoTracker();
            }

            renderStudentsTable();
            let protectedCount = updates.filter(u => u.remark !== "").length;
            let msg = `成功为 ${updates.length} 名学生调整积分。`;
            if (protectedCount > 0) msg += ` 其中 ${protectedCount} 人触发积分保护。`;
            if (lowScoreTriggered) msg += " 有学生触发低分补分机制。";
            document.getElementById("adminMsg").innerText = msg;
        }

        // ============================================================
        // 9. 自动补分（低分持续补分 + 周日奖励）
        // ============================================================
        async function loadAutoTracker() {
            try {
                const res = await fetchJSON(AUTO_TRACK_URL);
                if (res.content) {
                    autoTracker = res.content;
                } else {
                    autoTracker = { lastDailyCheck: 0, stopped: false, lastSundayBonus: 0, lowScoreStudents: {} };
                }
                if (!autoTracker.hasOwnProperty('lastSundayBonus')) autoTracker.lastSundayBonus = 0;
                if (!autoTracker.hasOwnProperty('lowScoreStudents')) autoTracker.lowScoreStudents = {};
            } catch(e) {
                console.warn("加载自动补分跟踪失败", e);
                autoTracker = { lastDailyCheck: 0, stopped: false, lastSundayBonus: 0, lowScoreStudents: {} };
            }
        }

        async function saveAutoTracker() {
            try {
                await saveJSON(AUTO_TRACK_URL, autoTracker, "更新自动补分追踪");
            } catch(e) {
                console.error("保存自动补分跟踪失败", e);
                alert("保存自动补分状态失败，请检查网络或Token权限");
            }
        }

        async function runAutoIncrement() {
            if (autoTracker.stopped) {
                document.getElementById("autoIncStatus").innerHTML = "状态：⏸️ 已停止";
                return;
            }

            const beijingNow = getBeijingNow();
            const todayDate = getBeijingDateStr(beijingNow);
            const lastCheckDate = autoTracker.lastDailyCheck ? getBeijingDateStr(new Date(autoTracker.lastDailyCheck)) : null;

            // 如果今天已经执行过且不是强制运行，则跳过
            if (lastCheckDate === todayDate && !window.forceRun) {
                document.getElementById("autoIncStatus").innerHTML = `状态：✅ 运行中（今日已补分，下次检查：明天）`;
                return;
            }

            // ---------- 开始执行补分 ----------
            let updates = [];

            // ---- 1. 低分持续补分（每天+2，连续7天，不受倍率） ----
            for (let student of currentStudents) {
                if (student.score < -50) {
                    let tracker = autoTracker.lowScoreStudents[student.id];
                    if (!tracker) {
                        // 如果未初始化，跳过（理论上不应发生）
                        continue;
                    }
                    // 检查开始日期是否已到
                    if (todayDate < tracker.startDate) continue;
                    if (tracker.daysAdded < 7) {
                        // 直接加2分
                        const oldScore = student.score;
                        student.score += 2;
                        student.score = parseFloat(student.score.toFixed(2));
                        updates.push({
                            studentId: student.id,
                            studentName: student.name,
                            delta: 2,
                            reason: "低分持续补分（第" + (tracker.daysAdded + 1) + "天）"
                        });
                        tracker.daysAdded++;
                        console.log(`[补分] ${student.id} ${student.name} 第${tracker.daysAdded}天: ${oldScore} -> ${student.score}`);
                    }
                }
            }

            // ---- 2. 周日奖励（北京时间周日0点以后执行） ----
            if (getBeijingWeekday(beijingNow) === 0) {
                const lastSundayDate = autoTracker.lastSundayBonus ? getBeijingDateStr(new Date(autoTracker.lastSundayBonus)) : null;
                if (lastSundayDate !== todayDate || window.forceRun) {
                    const currentWeek = getWeekNumber(beijingNow);
                    let ratings = {};
                    try {
                        const res = await fetchJSON(RATINGS_URL);
                        if (res.content) ratings = res.content.ratings || {};
                    } catch(e) { /* ignore */ }
                    const weekRatings = ratings[currentWeek] || {};
                    const participants = Object.keys(weekRatings);
                    if (participants.length > 0) {
                        for (let sid of participants) {
                            const student = currentStudents.find(s => s.id === sid);
                            if (student) {
                                const delta = 0.5;
                                const { actualDelta, remark } = calculateProtectedDelta(student.score, delta);
                                if (actualDelta !== 0) {
                                    student.score += actualDelta;
                                    student.score = parseFloat(student.score.toFixed(2));
                                    updates.push({
                                        studentId: student.id,
                                        studentName: student.name,
                                        delta: actualDelta,
                                        reason: "周日评价奖励" + remark
                                    });
                                }
                            }
                        }
                    }
                    autoTracker.lastSundayBonus = beijingNow.getTime();
                }
            }

            // ---- 保存更新 ----
            if (updates.length > 0) {
                try {
                    // 1. 保存学生积分
                    await saveStudents();
                    // 2. 保存原因记录（使用北京时间）
                    const timestamp = formatBeijingTime(beijingNow);
                    for (let u of updates) {
                        currentReasons.push({
                            timestamp: timestamp,
                            studentId: u.studentId,
                            studentName: u.studentName,
                            delta: u.delta,
                            reason: u.reason
                        });
                    }
                    await saveReasons();
                    // 3. 保存 autoTracker（包含 daysAdded 更新）
                    await saveAutoTracker();
                    renderStudentsTable();
                    document.getElementById("adminMsg").innerHTML = `自动补分执行，${updates.length}名学生获得积分调整。`;
                } catch (err) {
                    console.error("补分保存失败", err);
                    document.getElementById("adminMsg").innerHTML = `补分保存失败：${err.message}`;
                }
            } else {
                // 即使无更新，也要更新 lastDailyCheck，避免每天重复检查
                console.log("今日无补分操作");
            }

            // 更新最后检查日期（北京时间）
            autoTracker.lastDailyCheck = beijingNow.getTime();
            await saveAutoTracker();
            document.getElementById("autoIncStatus").innerHTML = `状态：✅ 运行中（上次补分：${beijingNow.toLocaleDateString('zh-CN')}）`;
            window.forceRun = false;
        }

        async function stopAutoIncrement() {
            autoTracker.stopped = true;
            await saveAutoTracker();
            document.getElementById("autoIncStatus").innerHTML = "状态：⏸️ 已停止";
            alert("已停止自动补分");
        }
        async function resumeAutoIncrement() {
            autoTracker.stopped = false;
            await saveAutoTracker();
            document.getElementById("autoIncStatus").innerHTML = "状态：✅ 运行中";
            alert("已开启自动补分");
        }
        async function manualRunAutoIncrement() {
            window.forceRun = true;
            await runAutoIncrement();
            window.forceRun = false;
        }

        // ============================================================
        // 10. 学生管理功能
        // ============================================================
        async function addStudent() {
            const id = document.getElementById("stuId").value.trim();
            const name = document.getElementById("stuName").value.trim();
            let score = parseFloat(document.getElementById("stuScore").value);
            if (!id || !name) { alert("学号和姓名不能为空"); return; }
            if (isNaN(score)) score = 100;
            score = Math.min(1000000000, Math.max(-1000000000, score));
            if (currentStudents.find(s => s.id === id)) { alert("学号已存在"); return; }
            currentStudents.push({ id, name, score });
            await saveStudents();
            renderStudentsTable();
            document.getElementById("adminMsg").innerText = "添加成功";
        }

        async function updateStudent() {
            if (!selectedStudentId) { alert("请先选择一个学生（点选单选按钮）"); return; }
            const id = document.getElementById("stuId").value.trim();
            const name = document.getElementById("stuName").value.trim();
            let score = parseFloat(document.getElementById("stuScore").value);
            if (!id || !name) { alert("学号和姓名不能为空"); return; }
            if (isNaN(score)) score = 100;
            score = Math.min(1000000000, Math.max(-10000000000, score));
            const index = currentStudents.findIndex(s => s.id === selectedStudentId);
            if (index === -1) return;
            if (id !== selectedStudentId && currentStudents.some(s => s.id === id)) { alert("新学号已存在"); return; }

            const oldScore = currentStudents[index].score;
            // 更新
            currentStudents[index] = { id, name, score };
            await saveStudents();

            // 记录修改积分的原因（如果积分变化）
            if (oldScore !== score) {
                const delta = score - oldScore;
                const beijingNow = getBeijingNow();
                const timestamp = formatBeijingTime(beijingNow);
                currentReasons.push({
                    timestamp: timestamp,
                    studentId: id,
                    studentName: name,
                    delta: delta,
                    reason: `修改积分为 ${score}`
                });
                await saveReasons();

            }

            selectedStudentId = id;
            renderStudentsTable();
            document.getElementById("adminMsg").innerText = "修改成功";
        }

        async function deleteStudent() {
            if (!selectedStudentId) { alert("请先选择一个学生（点选单选按钮）"); return; }
            if (!confirm("确定删除吗？")) return;
            currentStudents = currentStudents.filter(s => s.id !== selectedStudentId);
            await saveStudents();
            selectedStudentId = null;
            renderStudentsTable();
            document.getElementById("adminMsg").innerText = "删除成功";
        }

        async function swapStudents() {
            const id1 = document.getElementById("swapId1").value.trim();
            const id2 = document.getElementById("swapId2").value.trim();
            if (!id1 || !id2) { alert("请输入两个学号"); return; }
            const stu1 = currentStudents.find(s => s.id === id1);
            const stu2 = currentStudents.find(s => s.id === id2);
            if (!stu1 || !stu2) { alert("学号不存在"); return; }
            stu1.id = id2;
            stu2.id = id1;
            for (let r of currentReasons) {
                if (r.studentId === id1) r.studentId = id2;
                else if (r.studentId === id2) r.studentId = id1;
            }
            await saveStudents();
            await saveReasons();
            renderStudentsTable();
            document.getElementById("adminMsg").innerText = "学号交换成功，并已同步历史记录";
        }

        async function resetToInitial() {
            const clearReasons = confirm("将所有人积分重置为0，是否同时清空所有积分变化记录？\n点击“确定”清空记录，点击“取消”保留记录。");
            for (let s of currentStudents) { s.score = 0; }
            await saveStudents();
            if (clearReasons) {
                currentReasons = [];
                await saveReasons();
            }
            renderStudentsTable();
            document.getElementById("adminMsg").innerText = "已将所有学生积分重置为0" + (clearReasons ? "，并清空了记录" : "");
        }

        function filterStudents() {
            const searchId = document.getElementById("searchIdAdmin").value.trim();
            if (!searchId) renderStudentsTable();
            else {
                const filtered = currentStudents.filter(s => s.id.includes(searchId));
                const tbody = document.querySelector("#stuTable tbody");
                tbody.innerHTML = "";
                filtered.forEach(s => {
                    const row = tbody.insertRow();
                    row.insertCell(0).innerText = s.id;
                    row.insertCell(1).innerText = s.name;
                    row.insertCell(2).innerText = (typeof s.score === 'number' ? s.score.toFixed(2) : s.score);
                    const chkCell = row.insertCell(3);
                    const chk = document.createElement("input");
                    chk.type = "checkbox";
                    chk.className = "student-checkbox";
                    chk.value = s.id;
                    chkCell.appendChild(chk);
                    const actionCell = row.insertCell(4);
                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = "selectedStu";
                    radio.value = s.id;
                    radio.onclick = () => {
                        selectedStudentId = s.id;
                        document.getElementById("stuId").value = s.id;
                        document.getElementById("stuName").value = s.name;
                        document.getElementById("stuScore").value = s.score;
                    };
                    actionCell.appendChild(radio);
                    actionCell.appendChild(document.createTextNode(" 选中"));
                });
            }
        }

        function exportStudents() {
            const wsData = [["学号", "姓名", "积分"]];
            currentStudents.forEach(s => wsData.push([s.id, s.name, s.score]));
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "学生积分");
            XLSX.writeFile(wb, `学生积分_${new Date().toLocaleString()}.xlsx`);
        }

        function exportReasons() {
            const wsData = [["时间", "学号", "姓名", "分数变化", "原因"]];
            currentReasons.forEach(r => wsData.push([r.timestamp, r.studentId, r.studentName, (r.delta>0?"+":"")+r.delta, r.reason]));
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "积分变化记录");
            XLSX.writeFile(wb, `积分变化_${new Date().toLocaleString()}.xlsx`);
        }

        function bindSortEvents() {
            document.querySelectorAll("#stuTable th").forEach(th => {
                th.addEventListener("click", () => {
                    const field = th.getAttribute("data-sort");
                    if (!field) return;
                    if (currentSort.field === field) {
                        currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort.field = field;
                        currentSort.order = 'asc';
                    }
                    renderStudentsTable();
                });
            });
        }

        // ============================================================
        // 11. 班委评价统计
        // ============================================================
        async function loadAdminCommitteeStats() {
            const container = document.getElementById("adminStatsContainer");
            if (!container) return;
            const committeePositions = ["班长", "副班长/纪律委员", "团支书", "卫生委员/宣传委员", "学习委员", "体育委员"];
            let committeeNames = {};
            try {
                const classResp = await fetch(CLASS_URL);
                if (classResp.ok) {
                    const data = await classResp.json();
                    const content = base64DecodeToUtf8(data.content);
                    const members = JSON.parse(content).members || [];
                    members.forEach(m => { committeeNames[m.position] = m.name; });
                }
            } catch(e) { /* ignore */ }

            let ratings = {};
            try {
                const resp = await fetch(RATINGS_URL);
                if (resp.ok) {
                    const data = await resp.json();
                    const content = base64DecodeToUtf8(data.content);
                    ratings = JSON.parse(content).ratings || {};
                }
            } catch(e) { /* ignore */ }

            let html = '<table style="width:auto; margin-top:8px;"><tr><th>周次</th>';
            committeePositions.forEach(p => { html += `<th>${p}</th>`; });
            html += '<th>参与人数</th></tr>';

            const weekKeys = Object.keys(ratings).sort();
            if (weekKeys.length === 0) {
                html += '<tr><td colspan="' + (committeePositions.length + 2) + '">暂无评价数据</td></tr>';
            } else {
                for (let week of weekKeys) {
                    const weekData = ratings[week] || {};
                    const stats = {};
                    committeePositions.forEach(p => { stats[p] = { verygood:0, good:0, justsoso:0, littlebad:0, bad:0, total:0 }; });
                    let participants = 0;
                    for (let sid in weekData) {
                        participants++;
                        for (let pos in weekData[sid]) {
                            if (stats[pos]) {
                                stats[pos].total++;
                                const val = weekData[sid][pos];
                                if (val === "verygood") stats[pos].verygood++;
                                else if (val === "good") stats[pos].good++;
                                else if (val === "justsoso") stats[pos].justsoso++;
                                else if (val === "littlebad") stats[pos].littlebad++;
                                else if (val === "bad") stats[pos].bad++;
                            }
                        }
                    }
                    html += `<tr><td>${week}</td>`;
                    committeePositions.forEach(p => {
                        const total = stats[p].total;
                        const weightedSum = stats[p].verygood * 1 + stats[p].good * 0.5 + stats[p].justsoso * 0 + stats[p].littlebad * (-0.5) + stats[p].bad * (-1);
                        const avg = total === 0 ? 0 : weightedSum / total;
                        const rate = (avg * 100).toFixed(1);
                        html += `<td>${rate}% (${weightedSum}/${total})</td>`;
                    });
                    html += `<td>${participants}</td></tr>`;
                }
            }
            html += '</table>';
            container.innerHTML = html;
        }

        async function clearAllRatings() {
            if (!confirm("确定要清空所有班委评价数据吗？此操作不可恢复！")) return;
            try {
                const token = CONFIG.github_token;
                const resp = await fetch(RATINGS_URL, { headers: { Authorization: `token ${token}` } });
                let sha = null;
                if (resp.ok) {
                    const data = await resp.json();
                    sha = data.sha;
                }
                const emptyData = { ratings: {} };
                const content = utf8ToBase64(JSON.stringify(emptyData, null, 2));
                const putResp = await fetch(RATINGS_URL, {
                    method: "PUT",
                    headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "清空评价数据", content: content, sha: sha })
                });
                if (putResp.ok) {
                    alert("清空成功！");
                    await loadAdminCommitteeStats();
                } else throw new Error("清空失败");
            } catch(e) {
                alert("操作失败：" + e.message);
            }
        }

        // ============================================================
        // 12. 登录初始化
        // ============================================================
        document.getElementById("loginBtn").onclick = async () => {
            await loadConfig();
            const pwd = document.getElementById("adminPwd").value;
            const pwdHash = await sha256(pwd);
            const effectiveHash = CONFIG.admin_password_hash || ADMIN_PASSWORD_HASH;
            if (pwdHash !== effectiveHash) {
                document.getElementById("loginMsg").innerText = "密码错误";
                return;
            }
            if (!CONFIG.github_token) {
                document.getElementById("loginMsg").innerText = "无法从仓库读取 Token，请检查 config_encoded.json";
                return;
            }
            try {
                await loadAllData();
                                document.getElementById("loginPanel").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                renderStudentsTable();
                renderRulesList();
                bindSortEvents();
                await loadAdminCommitteeStats();
                document.getElementById("addStuBtn").onclick = addStudent;
                document.getElementById("updateStuBtn").onclick = updateStudent;
                document.getElementById("deleteStuBtn").onclick = deleteStudent;
                document.getElementById("swapBtn").onclick = swapStudents;
                document.getElementById("searchAdminBtn").onclick = filterStudents;
                document.getElementById("resetAdminBtn").onclick = () => { document.getElementById("searchIdAdmin").value = ""; renderStudentsTable(); };
                document.getElementById("exportStudentsBtn").onclick = exportStudents;
                document.getElementById("exportReasonsBtn").onclick = exportReasons;
                document.getElementById("resetInitialBtn").onclick = resetToInitial;
                document.getElementById("selectAllBtn").onclick = () => { document.querySelectorAll(".student-checkbox").forEach(cb => cb.checked = true); };
                document.getElementById("deselectAllBtn").onclick = () => { document.querySelectorAll(".student-checkbox").forEach(cb => cb.checked = false); };
                document.getElementById("applyQuickBtn").onclick = applyToCheckedStudents;
                document.getElementById("clearAllRatingsBtn").onclick = clearAllRatings;
            } catch (err) {
                document.getElementById("loginMsg").innerText = "加载数据失败：" + err.message;
                console.error(err);
            }
        };
