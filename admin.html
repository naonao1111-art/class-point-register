<!-- admin.html - 管理员后台（已添加积分保护机制：低于-30分，扣分减半，加分翻倍） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员后台</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table, th, td { border: 1px solid #ccc; border-collapse: collapse; padding: 5px; }
        .section { margin: 20px 0; padding: 10px; border: 1px solid #aaa; }
        button { margin: 2px; }
        .error { color: red; }
        .success { color: green; }
        th { cursor: pointer; user-select: none; background-color: #f2f2f2; }
        th:hover { background-color: #e0e0e0; }
        .nav-section { background: #e3f2fd; padding: 12px; border-radius: 5px; margin-bottom: 20px; }
        .nav-section a { margin-right: 20px; color: #1565c0; text-decoration: none; font-weight: bold; }
        .nav-section a:hover { text-decoration: underline; }
        .rule-tag { display: inline-block; background: #eee; padding: 5px 10px; margin: 3px; border-radius: 20px; cursor: pointer; }
        .rule-tag:hover { background: #ddd; }
        .score-add { color: #4CAF50; }
        .score-sub { color: #f44336; }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="loginPanel">
        <h2>管理员登录</h2>
        <div>
            <label>后台密码: </label>
            <input type="password" id="adminPwd" placeholder="密码">
            <button id="loginBtn">登录</button>
            <p id="loginMsg" class="error"></p>
        </div>
    </div>

    <div id="adminPanel" style="display:none;">
        <h1>班级积分管理后台</h1>

        <div class="nav-section">
            <a href="show_control.html">管理积分规则</a>
            <a href="class_control.html">管理班委</a>
        </div>

        <div class="section">
            <h3>学生增删改查</h3>
            <div>
                <input type="text" id="stuId" placeholder="学号">
                <input type="text" id="stuName" placeholder="姓名">
                <input type="number" id="stuScore" placeholder="积分" step="any" value="100">
                <button id="addStuBtn">添加学生</button>
                <button id="updateStuBtn">修改当前选中</button>
                <button id="deleteStuBtn">删除选中</button>
                <button id="resetInitialBtn" style="background-color:#ff9800;">重置所有积分为0</button>
            </div>
            <hr>
            <div>
                <input type="text" id="searchIdAdmin" placeholder="按学号查询">
                <button id="searchAdminBtn">查询</button>
                <button id="resetAdminBtn">显示全部</button>
                <button id="exportStudentsBtn">导出学生积分表 (XLSX)</button>
                <button id="exportReasonsBtn">导出积分变化记录 (XLSX)</button>
            </div>
            <table id="stuTable">
                <thead>
                    <tr><th data-sort="id">学号 ▲▼</th><th data-sort="name">姓名 ▲▼</th><th data-sort="score">积分 ▲▼</th><th>选择</th><th>操作</th>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="section">
            <h3>互换学号（只交换学号，姓名和积分不变）</h3>
            <input type="text" id="swapId1" placeholder="学号A">
            <input type="text" id="swapId2" placeholder="学号B">
            <button id="swapBtn">交换</button>
        </div>

        <!-- 合并后的快捷加减分 + 批量修改面板 -->
        <div class="section">
            <h3>加减分</h3>
            <div id="rulesList" style="margin-bottom: 10px; max-height: 200px; overflow-y: auto; border:1px solid #eee; padding: 8px;">
                <p>加载规则中...</p>
            </div>
            <div style="margin-bottom: 8px;">
                <button id="selectAllBtn" style="background-color:#4CAF50;">全选</button>
                <button id="deselectAllBtn" style="background-color:#f44336;">取消全选</button>
            </div>
            <div>
                <label>分数变化：</label>
                <input type="number" id="quickDelta" step="any" placeholder="例如 +3.5 或 -2" value="0">
                <label>原因：</label>
                <input type="text" id="quickReason" placeholder="原因（可编辑、追加文字）" style="width: 250px;">
                <button id="applyQuickBtn" style="background-color:#2196F3; color:white;">应用到选中学生</button>
                <p style="font-size:12px; color:#666;">👉 点击规则自动填充分数和原因，点击上方按钮批量应用。<br>
                ⚠️ 积分保护: 当前积分低于-30分时，扣分减半，加分翻倍，并自动备注(减半扣分)/(双倍加分)。</p>
            </div>
        </div>

        <div class="section">
            <h3>加减分原因记录</h3>
            <table id="reasonsTable">
                <thead><tr><th>时间</th><th>学号</th><th>姓名</th><th>分数变化</th><th>原因（可编辑）</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <p id="adminMsg"></p>
    </div>

    <!-- 密码模态框 -->
    <div id="passwordModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
        <div style="background:white; width:300px; margin:100px auto; padding:20px; border-radius:8px;">
            <h3>请输入管理员密码</h3>
            <input type="password" id="modalPassword" style="width:100%; padding:5px;">
            <div style="margin-top:10px;">
                <button id="modalConfirmBtn">确认</button>
                <button id="modalCancelBtn">取消</button>
            </div>
        </div>
    </div>

    <script>
        const REPO_OWNER = "naonao1111-art";
        const REPO_NAME = "class-point-register";
        const DATA_FILE = "data.json";
        const REASONS_FILE = "reasons.json";
        const RULES_FILE = "rules.json";
        const DATA_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`;
        const REASONS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REASONS_FILE}`;
        const RULES_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${RULES_FILE}`;
        const ADMIN_PASSWORD_HASH = "621afced69a8a7037d5576facd2b9ae488da1988b6f847fb6f6e724f734eb30c";

        let currentStudents = [];
        let currentReasons = [];
        let currentRules = [];
        let dataSha = "";
        let reasonsSha = "";
        let selectedStudentId = null;
        let currentSort = { field: 'id', order: 'asc' };

        function decodeToken(obfuscated) {
            try {
                if (!obfuscated) return "";
                const reversed = obfuscated.split('').reverse().join('');
                const shifted = atob(reversed);
                return shifted.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 1)).join('');
            } catch (e) {
                console.error("Token 解码失败", e);
                return "";
            }
        }

        let CONFIG = { github_token: "" };
        async function loadConfig() {
            try {
                const resp = await fetch(
                    "https://naonao1111-art.github.io/class-point-register/config_encoded.json?t=" + Date.now(),
                    { cache: "no-store" }
                );
                if (resp.ok) {
                    const config = await resp.json();
                    CONFIG = {
                        admin_password_hash: config.admin_password_hash || "",
                        github_token: decodeToken(config.github_token_obfuscated || "")
                    };
                }
            } catch (e) {
                console.error("加载配置失败", e);
            }
        }

        async function sha256(message) {
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function base64DecodeToUtf8(base64Str) {
            const binaryStr = atob(base64Str);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }
        function utf8ToBase64(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            let binary = '';
            for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
            return btoa(binary);
        }

        async function fetchJSON(url) {
            const tokenStr = CONFIG.github_token;
            const headers = tokenStr ? { Authorization: `token ${tokenStr}` } : {};
            const resp = await fetch(url, { headers });
            if (resp.status === 404) return { content: null, sha: null };
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const content = JSON.parse(base64DecodeToUtf8(data.content));
            return { content, sha: data.sha };
        }

        async function saveJSON(url, content, sha, message) {
            const jsonStr = JSON.stringify(content, null, 2);
            const newContent = utf8ToBase64(jsonStr);
            const payload = { message, content: newContent, sha };
            const tokenStr = CONFIG.github_token;
            const resp = await fetch(url, {
                method: "PUT",
                headers: { Authorization: `token ${tokenStr}`, "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!resp.ok) throw new Error(`保存失败 HTTP ${resp.status}`);
            const result = await resp.json();
            return result.content.sha;
        }

        async function loadAllData() {
            const dataRes = await fetchJSON(DATA_URL);
            if (dataRes.content) {
                currentStudents = (dataRes.content.students || []).map(s => ({ ...s, score: parseFloat(s.score) }));
                dataSha = dataRes.sha;
            } else {
                currentStudents = [];
                dataSha = null;
            }
            const reasonsRes = await fetchJSON(REASONS_URL);
            if (reasonsRes.content) {
                currentReasons = reasonsRes.content;
                reasonsSha = reasonsRes.sha;
            } else {
                currentReasons = [];
                reasonsSha = null;
            }
            const rulesRes = await fetchJSON(RULES_URL);
            if (rulesRes.content && rulesRes.content.rules) {
                currentRules = rulesRes.content.rules;
            } else {
                currentRules = [];
            }
        }

        async function saveStudents() {
            const newData = { students: currentStudents };
            dataSha = await saveJSON(DATA_URL, newData, dataSha, "更新学生数据");
        }
        async function saveReasons() {
            reasonsSha = await saveJSON(REASONS_URL, currentReasons, reasonsSha, "更新原因记录");
        }

        function sortStudents(students, field, order) {
            const sorted = [...students];
            sorted.sort((a, b) => {
                let valA = a[field];
                let valB = b[field];
                if (field === 'score') {
                    valA = parseFloat(valA);
                    valB = parseFloat(valB);
                    if (valA < valB) return order === 'asc' ? -1 : 1;
                    if (valA > valB) return order === 'asc' ? 1 : -1;
                    return 0;
                } else {
                    valA = String(valA);
                    valB = String(valB);
                    const compareResult = valA.localeCompare(valB, 'zh-CN');
                    return order === 'asc' ? compareResult : -compareResult;
                }
            });
            return sorted;
        }

        function renderStudentsTable() {
            const tbody = document.querySelector("#stuTable tbody");
            tbody.innerHTML = "";
            const sorted = sortStudents(currentStudents, currentSort.field, currentSort.order);
            sorted.forEach(s => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = s.id;
                row.insertCell(1).innerText = s.name;
                row.insertCell(2).innerText = (typeof s.score === 'number' ? s.score.toFixed(2) : s.score);
                const chkCell = row.insertCell(3);
                const chk = document.createElement("input");
                chk.type = "checkbox";
                chk.className = "student-checkbox";
                chk.value = s.id;
                chkCell.appendChild(chk);
                const actionCell = row.insertCell(4);
                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = "selectedStu";
                radio.value = s.id;
                radio.onclick = () => { selectedStudentId = s.id; };
                actionCell.appendChild(radio);
                actionCell.appendChild(document.createTextNode(" 选中"));
            });
        }

        function renderReasonsTable() {
            const tbody = document.querySelector("#reasonsTable tbody");
            tbody.innerHTML = "";
            currentReasons.forEach((r, idx) => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = r.timestamp;
                row.insertCell(1).innerText = r.studentId;
                row.insertCell(2).innerText = r.studentName;
                row.insertCell(3).innerText = (r.delta > 0 ? "+" : "") + parseFloat(r.delta).toFixed(2);
                const reasonCell = row.insertCell(4);
                const inputReason = document.createElement("input");
                inputReason.type = "text";
                inputReason.value = r.reason;
                inputReason.style.width = "200px";
                reasonCell.appendChild(inputReason);
                const btnCell = row.insertCell(5);
                const saveBtn = document.createElement("button");
                saveBtn.innerText = "保存";
                saveBtn.onclick = async () => {
                    currentReasons[idx].reason = inputReason.value;
                    await saveReasons();
                    renderReasonsTable();
                    document.getElementById("adminMsg").innerText = "原因已更新";
                };
                btnCell.appendChild(saveBtn);
            });
        }

        function renderRulesList() {
            const container = document.getElementById("rulesList");
            if (!container) return;
            if (currentRules.length === 0) {
                container.innerHTML = '<p>暂无积分规则，请先在“管理积分规则”中添加。</p>';
                return;
            }
            const addRules = currentRules.filter(r => r.score > 0);
            const subRules = currentRules.filter(r => r.score < 0);
            let html = '<div><strong>加分</strong><br/>';
            addRules.forEach(r => {
                html += `<span class="rule-tag" data-score="${r.score}" data-action="${escapeHtml(r.action)}">${escapeHtml(r.action)} +${r.score}</span> `;
            });
            html += '</div><div style="margin-top:6px;"><strong>减分</strong><br/>';
            subRules.forEach(r => {
                html += `<span class="rule-tag" data-score="${r.score}" data-action="${escapeHtml(r.action)}">${escapeHtml(r.action)} ${r.score}</span> `;
            });
            html += '</div>';
            container.innerHTML = html;
            document.querySelectorAll('.rule-tag').forEach(el => {
                el.addEventListener('click', () => {
                    const score = parseFloat(el.getAttribute('data-score'));
                    const action = el.getAttribute('data-action');
                    document.getElementById('quickDelta').value = score;
                    document.getElementById('quickReason').value = action;
                });
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        let modalResolve = null;
        function showPasswordModal() {
            return new Promise((resolve) => {
                modalResolve = resolve;
                document.getElementById("passwordModal").style.display = "block";
                document.getElementById("modalPassword").value = "";
                document.getElementById("modalPassword").focus();
            });
        }
        document.getElementById("modalConfirmBtn").onclick = async () => {
            const pwd = document.getElementById("modalPassword").value;
            document.getElementById("passwordModal").style.display = "none";
            if (modalResolve) modalResolve(pwd);
        };
        document.getElementById("modalCancelBtn").onclick = () => {
            document.getElementById("passwordModal").style.display = "none";
            if (modalResolve) modalResolve(null);
        };

        async function verifyPassword() {
            const pwd = await showPasswordModal();
            if (!pwd) return false;
            const pwdHash = await sha256(pwd);
            const effectiveHash = CONFIG.admin_password_hash || ADMIN_PASSWORD_HASH;
            if (pwdHash !== effectiveHash) {
                alert("密码错误，操作取消");
                return false;
            }
            return true;
        }

        // 批量加减分（基于当前选中的复选框）+ 积分保护机制: 低于-30分, 扣分减半、加分翻倍
        async function applyToCheckedStudents() {
            const checkboxes = document.querySelectorAll(".student-checkbox:checked");
            if (checkboxes.length === 0) {
                alert("请至少勾选一名学生");
                return;
            }
            const delta = parseFloat(document.getElementById("quickDelta").value);
            if (isNaN(delta) || delta === 0) {
                alert("请输入有效的分数变化（非0）");
                return;
            }
            let reason = document.getElementById("quickReason").value.trim();
            if (!reason) {
                alert("请输入原因");
                return;
            }

            const updates = [];
            for (let chk of checkboxes) {
                const sid = chk.value;
                const student = currentStudents.find(s => s.id === sid);
                if (!student) continue;
                
                let actualDelta = delta;           // 实际应用的变化值
                let extraRemark = "";               // 需要追加的原因备注
                const currentScore = student.score;
                
                // 积分保护逻辑: 当前积分低于 -30 分时（包含 -30 本身？用小于 -30 更合理，严格低于-30）
                if (currentScore < -30) {
                    if (delta > 0) {      // 加分翻倍
                        actualDelta = delta * 2;
                        extraRemark = " (双倍加分)";
                    } else if (delta < 0) { // 扣分减半
                        actualDelta = delta / 2;
                        extraRemark = " (减半扣分)";
                    }
                }
                
                let newScore = student.score + actualDelta;
                newScore = Math.min(10000000, Math.max(-10000000, newScore));
                if (newScore !== student.score) updates.push({ student, newScore, actualDelta, extraRemark });
            }
            
            if (updates.length === 0) {
                alert("所选学生积分均无变化（已达上限或下限）");
                return;
            }

            if (!(await verifyPassword())) return;

            // 应用积分变更
            for (let u of updates) u.student.score = u.newScore;
            await saveStudents();

            const now = new Date();
            const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            
            const newRecords = updates.map(u => ({
                timestamp: timestamp,
                studentId: u.student.id,
                studentName: u.student.name,
                delta: u.actualDelta,
                reason: reason + u.extraRemark
            }));
            
            currentReasons.push(...newRecords);
            await saveReasons();

            renderStudentsTable();
            renderReasonsTable();
            let protectedCount = updates.filter(u => u.extraRemark !== "").length;
            let msg = `成功为 ${updates.length} 名学生调整积分。`;
            if (protectedCount > 0) msg += ` 其中 ${protectedCount} 人触发积分保护（低于-30分，已自动翻倍/减半）。`;
            document.getElementById("adminMsg").innerText = msg;
        }

        // 以下为增删改查等原有功能（带密码验证）
        async function addStudent() {
            if (!(await verifyPassword())) return;
            const id = document.getElementById("stuId").value.trim();
            const name = document.getElementById("stuName").value.trim();
            let score = parseFloat(document.getElementById("stuScore").value);
            if (!id || !name) { alert("学号和姓名不能为空"); return; }
            if (isNaN(score)) score = 100;
            score = Math.min(1000000000, Math.max(-10000000, score));
            if (currentStudents.find(s => s.id === id)) { alert("学号已存在"); return; }
            currentStudents.push({ id, name, score });
            await saveStudents();
            renderStudentsTable();
            document.getElementById("adminMsg").innerText = "添加成功";
        }
        async function updateStudent() {
            if (!selectedStudentId) { alert("请先选择一个学生（点选单选按钮）"); return; }
            if (!(await verifyPassword())) return;
            const id = document.getElementById("stuId").value.trim();
            const name = document.getElementById("stuName").value.trim();
            let score = parseFloat(document.getElementById("stuScore").value);
            if (!id || !name) { alert("学号和姓名不能为空"); return; }
            if (isNaN(score)) score = 100;
            score = Math.min(100000000, Math.max(-1000000000, score));
            const index = currentStudents.findIndex(s => s.id === selectedStudentId);
            if (index === -1) return;
            if (id !== selectedStudentId && currentStudents.some(s => s.id === id)) { alert("新学号已存在"); return; }
            currentStudents[index] = { id, name, score };
            await saveStudents();
            selectedStudentId = id;
            renderStudentsTable();
            document.getElementById("adminMsg").innerText = "修改成功";
        }
        async function deleteStudent() {
            if (!selectedStudentId) { alert("请先选择一个学生（点选单选按钮）"); return; }
            if (!(await verifyPassword())) return;
            if (!confirm("确定删除吗？")) return;
            currentStudents = currentStudents.filter(s => s.id !== selectedStudentId);
            await saveStudents();
            selectedStudentId = null;
            renderStudentsTable();
            document.getElementById("adminMsg").innerText = "删除成功";
        }
        async function swapStudents() {
            const id1 = document.getElementById("swapId1").value.trim();
            const id2 = document.getElementById("swapId2").value.trim();
            if (!id1 || !id2) { alert("请输入两个学号"); return; }
            const stu1 = currentStudents.find(s => s.id === id1);
            const stu2 = currentStudents.find(s => s.id === id2);
            if (!stu1 || !stu2) { alert("学号不存在"); return; }
            if (!(await verifyPassword())) return;
            stu1.id = id2;
            stu2.id = id1;
            for (let r of currentReasons) {
                if (r.studentId === id1) r.studentId = id2;
                else if (r.studentId === id2) r.studentId = id1;
            }
            await saveStudents();
            await saveReasons();
            renderStudentsTable();
            renderReasonsTable();
            document.getElementById("adminMsg").innerText = "学号交换成功，并已同步历史记录";
        }
        async function resetToInitial() {
            if (!(await verifyPassword())) return;
            const clearReasons = confirm("将所有人积分重置为0，是否同时清空所有积分变化记录？\n点击“确定”清空记录，点击“取消”保留记录。");
            for (let s of currentStudents) { s.score = 0; }
            await saveStudents();
            if (clearReasons) {
                currentReasons = [];
                await saveReasons();
            }
            renderStudentsTable();
            renderReasonsTable();
            document.getElementById("adminMsg").innerText = "已将所有学生积分重置为0" + (clearReasons ? "，并清空了记录" : "");
        }
        function filterStudents() {
            const searchId = document.getElementById("searchIdAdmin").value.trim();
            if (!searchId) renderStudentsTable();
            else {
                const filtered = currentStudents.filter(s => s.id.includes(searchId));
                const tbody = document.querySelector("#stuTable tbody");
                tbody.innerHTML = "";
                filtered.forEach(s => {
                    const row = tbody.insertRow();
                    row.insertCell(0).innerText = s.id;
                    row.insertCell(1).innerText = s.name;
                    row.insertCell(2).innerText = (typeof s.score === 'number' ? s.score.toFixed(2) : s.score);
                    const chkCell = row.insertCell(3);
                    const chk = document.createElement("input");
                    chk.type = "checkbox";
                    chk.className = "student-checkbox";
                    chk.value = s.id;
                    chkCell.appendChild(chk);
                    const actionCell = row.insertCell(4);
                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = "selectedStu";
                    radio.value = s.id;
                    radio.onclick = () => { selectedStudentId = s.id; };
                    actionCell.appendChild(radio);
                    actionCell.appendChild(document.createTextNode(" 选中"));
                });
            }
        }
        function exportStudents() {
            const wsData = [["学号", "姓名", "积分"]];
            currentStudents.forEach(s => wsData.push([s.id, s.name, s.score]));
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "学生积分");
            XLSX.writeFile(wb, `学生积分_${new Date().toLocaleString()}.xlsx`);
        }
        function exportReasons() {
            const wsData = [["时间", "学号", "姓名", "分数变化", "原因"]];
            currentReasons.forEach(r => wsData.push([r.timestamp, r.studentId, r.studentName, (r.delta>0?"+":"")+r.delta, r.reason]));
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "积分变化记录");
            XLSX.writeFile(wb, `积分变化_${new Date().toLocaleString()}.xlsx`);
        }
        function bindSortEvents() {
            document.querySelectorAll("#stuTable th").forEach(th => {
                th.addEventListener("click", () => {
                    const field = th.getAttribute("data-sort");
                    if (!field) return;
                    if (currentSort.field === field) {
                        currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort.field = field;
                        currentSort.order = 'asc';
                    }
                    renderStudentsTable();
                });
            });
        }

        document.getElementById("loginBtn").onclick = async () => {
            await loadConfig();
            const pwd = document.getElementById("adminPwd").value;
            const pwdHash = await sha256(pwd);
            const effectiveHash = CONFIG.admin_password_hash || ADMIN_PASSWORD_HASH;
            if (pwdHash !== effectiveHash) {
                document.getElementById("loginMsg").innerText = "密码错误";
                return;
            }
            if (!CONFIG.github_token) {
                document.getElementById("loginMsg").innerText = "无法从仓库读取 Token，请检查 config_encoded.json";
                return;
            }
            try {
                await loadAllData();
                document.getElementById("loginPanel").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                renderStudentsTable();
                renderReasonsTable();
                renderRulesList();
                bindSortEvents();

                document.getElementById("addStuBtn").onclick = addStudent;
                document.getElementById("updateStuBtn").onclick = updateStudent;
                document.getElementById("deleteStuBtn").onclick = deleteStudent;
                document.getElementById("swapBtn").onclick = swapStudents;
                document.getElementById("searchAdminBtn").onclick = filterStudents;
                document.getElementById("resetAdminBtn").onclick = () => { document.getElementById("searchIdAdmin").value = ""; renderStudentsTable(); };
                document.getElementById("exportStudentsBtn").onclick = exportStudents;
                document.getElementById("exportReasonsBtn").onclick = exportReasons;
                document.getElementById("resetInitialBtn").onclick = resetToInitial;

                document.getElementById("selectAllBtn").onclick = () => { document.querySelectorAll(".student-checkbox").forEach(cb => cb.checked = true); };
                document.getElementById("deselectAllBtn").onclick = () => { document.querySelectorAll(".student-checkbox").forEach(cb => cb.checked = false); };
                document.getElementById("applyQuickBtn").onclick = applyToCheckedStudents;
            } catch (err) {
                document.getElementById("loginMsg").innerText = "加载数据失败：" + err.message;
            }
        };
    </script>
</body>
</html>
