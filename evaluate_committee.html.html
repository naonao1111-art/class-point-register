<!-- evaluate_committee.html - 班委履职监督（评价页） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班委履职监督</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f7fa; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .time-status { background: #e8f4f8; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #2196F3; }
        .time-status.closed { background: #fce4e4; border-left-color: #f44336; }
        .committee-list { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .committee-card { border: 1px solid #ddd; border-radius: 10px; padding: 15px; background: #fafafa; }
        .committee-title { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
        .rating-buttons button { padding: 6px 16px; margin-right: 12px; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-good { background: #4CAF50; color: white; }
        .btn-good:hover { background: #45a049; }
        .btn-bad { background: #f44336; color: white; }
        .btn-bad:hover { background: #d32f2f; }
        .rated-info { color: #666; font-size: 14px; margin-top: 8px; }
        .error { color: #f44336; font-size: 14px; margin-top: 5px; }
        .success { color: #4CAF50; }
        #studentIdInput { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; width: 200px; }
        .login-area { margin-bottom: 20px; background: #f0f2f5; padding: 15px; border-radius: 10px; }
        .login-area button { padding: 6px 12px; background: #2196F3; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2196F3; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        hr { margin: 15px 0; }
        .stats-link { margin-top: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <a href="indexl.html" class="back-link">← 返回积分公示板</a>
    <h1>📋 班委履职监督</h1>
    <div id="timeStatus" class="time-status">检查开放时间中...</div>

    <div id="loginSection" class="login-area">
        <label>学号：</label>
        <input type="text" id="studentId" placeholder="输入你的学号 (例如 001)" style="width: 150px;">
        <button id="loginBtn">确认身份</button>
        <div id="loginError" class="error" style="margin-top:8px;"></div>
    </div>

    <div id="evaluationSection" style="display:none;">
        <p>你好，<span id="displayStudentId"></span> 同学，请对以下班委进行评价（每人每班委仅能评价一次）：</p>
        <div id="committeeList" class="committee-list"></div>
        <div id="msgArea" style="margin-top: 20px;"></div>
    </div>

    <div id="statsPreview" style="margin-top: 30px; border-top: 1px solid #ccc; padding-top: 15px;">
        <h3>📊 当前班委好评率（实时）</h3>
        <div id="statsContainer">加载中...</div>
    </div>
</div>

<script>
    const REPO_OWNER = "naonao1111-art";
    const REPO_NAME = "class-point-register";
    const RATINGS_FILE = "committee_ratings.json";
    const RATINGS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${RATINGS_FILE}`;
    const CLASS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/class_committee.json`;

    // 固定班委列表（也可动态读取，但为保证显示顺序，先定义，然后从class_committee同步职位名称）
    let committeePositions = ["班长", "副班长/纪律委员", "团支书", "学习委员", "卫生委员/宣传委员", "体育委员"];
    let committeeNames = {};   // 存储每个职位的当前姓名，用于展示

    let allRatings = {};       // 存储所有评价数据 { studentId: { "班长": "good", ... } }
    let currentStudent = null;  // 当前登录的学号
    let isVotingOpen = false;    // 是否在开放时间段

    // 辅助函数：解码Base64
    function base64DecodeToUtf8(base64Str) {
        const binaryStr = atob(base64Str);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }
    function utf8ToBase64(str) {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        let binary = '';
        for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
        return btoa(binary);
    }

    // 获取 GitHub Token
    let CONFIG = { github_token: "" };
    async function loadConfig() {
        try {
            const resp = await fetch("https://naonao1111-art.github.io/class-point-register/config_encoded.json?t=" + Date.now(), { cache: "no-store" });
            if (resp.ok) {
                const config = await resp.json();
                const decodeToken = (obf) => {
                    if (!obf) return "";
                    const reversed = obf.split('').reverse().join('');
                    const shifted = atob(reversed);
                    return shifted.split('').map(c => String.fromCharCode(c.charCodeAt(0)-1)).join('');
                };
                CONFIG.github_token = decodeToken(config.github_token_obfuscated || "");
            }
        } catch(e) { console.error(e); }
    }

    // 读取班委名单（获取姓名）
    async function fetchCommitteeMembers() {
        try {
            const resp = await fetch(CLASS_URL);
            if (resp.ok) {
                const data = await resp.json();
                const content = JSON.parse(base64DecodeToUtf8(data.content));
                const members = content.members || [];
                const posMap = {};
                members.forEach(m => { posMap[m.position] = m.name; });
                committeePositions.forEach(pos => {
                    committeeNames[pos] = posMap[pos] || "未知";
                });
            } else {
                committeePositions.forEach(pos => { committeeNames[pos] = "未设置"; });
            }
        } catch(e) { console.error(e); }
    }

    // 读取评价数据
    async function loadRatings() {
        try {
            const token = CONFIG.github_token;
            const headers = token ? { Authorization: `token ${token}` } : {};
            const resp = await fetch(RATINGS_URL, { headers });
            if (resp.status === 404) {
                allRatings = {};
                return;
            }
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const content = JSON.parse(base64DecodeToUtf8(data.content));
            allRatings = content.ratings || {};
        } catch(e) {
            console.warn("加载评价数据失败", e);
            allRatings = {};
        }
    }

    // 保存评价数据
    async function saveRatings() {
        const token = CONFIG.github_token;
        if (!token) throw new Error("无Token");
        // 先获取最新 sha
        let sha = null;
        try {
            const resp = await fetch(RATINGS_URL, { headers: { Authorization: `token ${token}` } });
            if (resp.ok) {
                const data = await resp.json();
                sha = data.sha;
            }
        } catch(e) {}
        const newContent = { ratings: allRatings };
        const jsonStr = JSON.stringify(newContent, null, 2);
        const contentBase64 = utf8ToBase64(jsonStr);
        const payload = { message: "更新班委评价", content: contentBase64, sha: sha || undefined };
        const putResp = await fetch(RATINGS_URL, {
            method: "PUT",
            headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if (!putResp.ok) throw new Error("保存失败");
    }

    // 检查开放时间（每周六0 ~ 周日24:00）
    function checkVotingOpen() {
        const now = new Date();
        const day = now.getDay();      // 0周日, 6周六
        const hour = now.getHours();
        const minute = now.getMinutes();
        const currentMinutes = hour * 60 + minute;
        if (day === 6) {
            // 周六 18:00 = 18*60 = 0
            return currentMinutes >= 0;
        } else if (day === 0) {
            // 周日 19:00 = 19*60 = 1140
            return currentMinutes <= 1440;
        }
        return false;
    }

    // 更新时间状态显示
    function updateTimeStatus() {
        const statusDiv = document.getElementById("timeStatus");
        const isOpen = checkVotingOpen();
        isVotingOpen = isOpen;
        if (isOpen) {
            statusDiv.innerHTML = "当前在评价开放时间（每周六 ~ 周日），你可以进行评价。";
            statusDiv.classList.remove("closed");
            statusDiv.classList.add("open");
        } else {
            statusDiv.innerHTML = "⏸️ 评价未开放，请在每周六至周日进行评价。现在只能查看历史结果。";
            statusDiv.classList.add("closed");
            statusDiv.classList.remove("open");
        }
    }

    // 渲染所有班委的好评率（供预览用）
    async function renderStats() {
        await loadRatings(); // 确保最新
        const statsContainer = document.getElementById("statsContainer");
        if (!statsContainer) return;
        const stats = {};
        committeePositions.forEach(pos => { stats[pos] = { good: 0, total: 0 }; });
        for (let sid in allRatings) {
            const ratings = allRatings[sid];
            for (let pos of committeePositions) {
                if (ratings[pos]) {
                    stats[pos].total++;
                    if (ratings[pos] === "good") stats[pos].good++;
                }
            }
        }
        let html = '<div style="display:flex; flex-wrap:wrap; gap:12px;">';
        committeePositions.forEach(pos => {
            const total = stats[pos].total;
            const good = stats[pos].good;
            const rate = total === 0 ? 0 : (good / total * 100).toFixed(1);
            html += `<div style="background:#f0f0f0; padding:8px 12px; border-radius:20px;">${pos} (${committeeNames[pos]}): ${rate}% (${good}/${total})</div>`;
        });
        html += '</div>';
        statsContainer.innerHTML = html;
    }

    // 渲染当前学生的评价界面（根据已评价情况）
    function renderEvaluationInterface() {
        const container = document.getElementById("committeeList");
        if (!container) return;
        if (!currentStudent) return;
        const myRatings = allRatings[currentStudent] || {};
        let html = '';
        committeePositions.forEach(pos => {
            const already = myRatings[pos];
            const posName = `${pos}（${committeeNames[pos]}）`;
            html += `<div class="committee-card">
                        <div class="committee-title">${posName}</div>`;
            if (already) {
                const statusText = already === "good" ? "✅ 已评价：称职" : "❌ 已评价：不称职";
                html += `<div class="rated-info">${statusText} (不可修改)</div>`;
            } else {
                html += `<div class="rating-buttons">
                            <button class="btn-good" data-pos="${pos}" data-value="good">👍 称职</button>
                            <button class="btn-bad" data-pos="${pos}" data-value="bad">👎 不称职</button>
                         </div>`;
            }
            html += `</div>`;
        });
        container.innerHTML = html;

        // 绑定按钮事件（未评价的）
        if (isVotingOpen) {
            document.querySelectorAll('.rating-buttons button').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const pos = btn.getAttribute('data-pos');
                    const value = btn.getAttribute('data-value');
                    await submitRating(pos, value);
                });
            });
        } else {
            // 不可评价时，如果已经有按钮，禁用提示
            const btns = document.querySelectorAll('.rating-buttons button');
            btns.forEach(btn => btn.disabled = true);
            if (btns.length) {
                const msgDiv = document.getElementById("msgArea");
                msgDiv.innerHTML = '<span class="error">当前不在开放时间段，无法评价。</span>';
            }
        }
    }

    // 提交评价
    async function submitRating(position, value) {
        if (!isVotingOpen) {
            alert("当前不在评价开放时间，无法提交！");
            return;
        }
        if (!currentStudent) {
            alert("请先登录学号");
            return;
        }
        // 再次检查是否已评价
        if (allRatings[currentStudent] && allRatings[currentStudent][position]) {
            alert("你已经评价过该班委，不可重复评价。");
            renderEvaluationInterface(); // 刷新界面
            return;
        }

        try {
            // 确保加载最新数据（防止并发）
            await loadRatings();
            if (allRatings[currentStudent] && allRatings[currentStudent][position]) {
                alert("你已经评价过该班委，不可重复评价。");
                renderEvaluationInterface();
                return;
            }
            if (!allRatings[currentStudent]) allRatings[currentStudent] = {};
            allRatings[currentStudent][position] = value;
            await saveRatings();
            document.getElementById("msgArea").innerHTML = `<span class="success">评价成功！已记录您对${position}的评价。</span>`;
            setTimeout(() => document.getElementById("msgArea").innerHTML = "", 3000);
            renderEvaluationInterface();   // 重新渲染（按钮会变成已评价状态）
            renderStats();                 // 更新下方的统计
        } catch(err) {
            alert("保存失败：" + err.message);
        }
    }

    // 登录/身份确认
    document.getElementById("loginBtn").addEventListener("click", async () => {
        const sid = document.getElementById("studentId").value.trim();
        if (!sid) {
            document.getElementById("loginError").innerText = "请输入学号";
            return;
        }
        // 可选：验证学号是否存在于学生列表（提高体验）
        // 但为了简单，先不强制验证，只做存储
        currentStudent = sid;
        document.getElementById("displayStudentId").innerText = currentStudent;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("evaluationSection").style.display = "block";
        await loadRatings();
        renderEvaluationInterface();
        renderStats();
    });

    // 初始化页面
    async function init() {
        await loadConfig();
        await fetchCommitteeMembers();
        updateTimeStatus();
        // 即使未登录，也显示统计
        await loadRatings();
        renderStats();
        // 定时刷新时间状态（每分钟）
        setInterval(() => {
            updateTimeStatus();
            if (!currentStudent && document.getElementById("evaluationSection").style.display !== "block") {
                // 未登录状态，只刷新统计
                renderStats();
            } else if (currentStudent) {
                // 已登录，刷新界面以更新可评价状态（时间变化时禁用按钮）
                renderEvaluationInterface();
            }
        }, 60000);
    }
    init();
</script>
</body>
</html>
