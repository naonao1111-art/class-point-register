<!-- indexl.html - 班级积分公示板（已添加积分变化记录入口） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班级积分公示板</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; cursor: pointer; user-select: none; }
        th:hover { background-color: #e0e0e0; }
        .error { color: red; }
        .search-box { margin-bottom: 10px; }
        .nav-links { margin-bottom: 15px; }
        .nav-links a { margin-right: 15px; color: #2196F3; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
        .rank-cell { font-weight: bold; color: #FF9800; }
        .rank-1 { color: #FFD700; font-size: 1.2em; }
        .rank-2 { color: #C0C0C0; font-size: 1.1em; }
        .rank-3 { color: #CD7F32; font-size: 1.1em; }
    </style>
</head>
<body>
    <h1>班级积分公示板</h1>
    <div class="nav-links">
        <a href="show.html">积分规则明细</a>
        <a href="class.html">班委情况</a>
        <a href="reasonsl.html">积分变化记录</a>
        <a href="evaluate_committee.html.html">班委评价</a>
    </div>
    <div id="committeeStats" style="margin: 15px 0; background: #f9f9f9; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0;">
        <h3 style="margin:0 0 8px 0; font-size: 16px;">班委履职好评率</h3>
        <div id="statsContainer" style="display: flex; flex-wrap: wrap; gap: 12px;">加载中...</div>
    </div>
    <div class="search-box">
        <input type="text" id="searchId" placeholder="按学号查询">
        <button id="searchBtn">查询</button>
        <button id="resetBtn">显示全部</button>
    </div>
    <table id="scoreTable">
        <thead><tr><th data-sort="id">学号 ▲▼</th><th data-sort="name">姓名 ▲▼</th><th data-sort="score">积分 ▲▼</th><th>排名</th></tr></thead>
        <tbody></tbody>
    </table>
    <script>
        const REPO_OWNER = "naonao1111-art";
        const REPO_NAME = "class-point-register";
        const DATA_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data.json`;

        let currentStudents = [];
        let currentSort = { field: 'id', order: 'asc' };
        let scoreRankings = {};

        function base64DecodeToUtf8(base64Str) {
            const binaryStr = atob(base64Str);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }

        function calcScoreRankings(students) {
            const sorted = [...students].sort((a, b) => parseFloat(b.score) - parseFloat(a.score));
            const map = {};
            sorted.forEach((s, i) => { map[s.id] = i + 1; });
            return map;
        }

        async function loadData() {
            try {
                const resp = await fetch(DATA_URL);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                const content = base64DecodeToUtf8(data.content);
                const json = JSON.parse(content);
                currentStudents = (json.students || []).map(s => ({ ...s, score: parseFloat(s.score) }));
                scoreRankings = calcScoreRankings(currentStudents);
                renderTable(currentStudents);
            } catch (err) {
                document.body.innerHTML += `<p class="error">加载失败：${err.message}</p>`;
            }
        }
        async function loadCommitteeStats() {
            const statsContainer = document.getElementById("statsContainer");
            if (!statsContainer) return;
            const CLASS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/class_committee.json`;
            const RATINGS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/committee_ratings.json`;
            const TARGET_POSITIONS = ["班长", "副班长/纪律委员", "团支书", "卫生委员/宣传委员", "学习委员", "体育委员"];
            let committeeInfo = [];
            try {
                const classResp = await fetch(CLASS_URL);
                if (classResp.ok) {
                    const data = await classResp.json();
                    const content = base64DecodeToUtf8(data.content);
                    const members = JSON.parse(content).members || [];
                    const posMap = {};
                    members.forEach(m => { posMap[m.position] = m.name; });
                    committeeInfo = TARGET_POSITIONS.map(pos => ({ position: pos, name: posMap[pos] || "未设置" }));
                } else {
                    committeeInfo = TARGET_POSITIONS.map(pos => ({ position: pos, name: "未设置" }));
                }
                const resp = await fetch(RATINGS_URL);
                let ratings = {};
                if (resp.ok) {
                    const data = await resp.json();
                    const content = base64DecodeToUtf8(data.content);
                    ratings = JSON.parse(content).ratings || {};
                }
                const stats = {};
                committeeInfo.forEach(c => { stats[c.position] = { good: 0, total: 0 }; });
                for (let sid in ratings) {
                    for (let pos in ratings[sid]) {
                        if (stats[pos]) {
                            stats[pos].total++;
                            if (ratings[sid][pos] === "good") stats[pos].good++;
                        }
                    }
                }
                let html = '';
                committeeInfo.forEach(c => {
                    const total = stats[c.position].total;
                    const good = stats[c.position].good;
                    const rate = total === 0 ? 0 : (good / total * 100).toFixed(1);
                    html += `<div style="background:#fff; border:1px solid #ddd; padding:5px 10px; border-radius:20px; font-size:14px;">${c.position} ${c.name}: ${rate}% (${good}/${total})</div>`;
                });
                statsContainer.innerHTML = html;
            } catch(e) {
                statsContainer.innerHTML = `<span style="color:gray">加载失败</span>`;
            }
        }
        loadCommitteeStats();

        function sortStudents(students, field, order) {
            const sorted = [...students];
            sorted.sort((a, b) => {
                let valA = a[field];
                let valB = b[field];
                if (field === 'score') {
                    valA = parseFloat(valA);
                    valB = parseFloat(valB);
                    if (valA < valB) return order === 'asc' ? -1 : 1;
                    if (valA > valB) return order === 'asc' ? 1 : -1;
                    return 0;
                } else {
                    valA = String(valA);
                    valB = String(valB);
                    const compareResult = valA.localeCompare(valB, 'zh-CN');
                    return order === 'asc' ? compareResult : -compareResult;
                }
            });
            return sorted;
        }

        function renderTable(students) {
            const sorted = sortStudents(students, currentSort.field, currentSort.order);
            const tbody = document.querySelector("#scoreTable tbody");
            tbody.innerHTML = "";
            sorted.forEach(s => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = s.id;
                row.insertCell(1).innerText = s.name;
                row.insertCell(2).innerText = (typeof s.score === 'number' ? s.score.toFixed(2) : s.score);
                const rank = scoreRankings[s.id] || '-';
                const rankCell = row.insertCell(3);
                rankCell.innerText = rank;
                rankCell.className = 'rank-cell';
                if (rank === 1) rankCell.classList.add('rank-1');
                else if (rank === 2) rankCell.classList.add('rank-2');
                else if (rank === 3) rankCell.classList.add('rank-3');
                <!-- indexl.html 中修改分数显示（积分低于-50标红） -->
                <!-- 在 renderTable 函数中，修改积分单元格的样式 -->
                row.insertCell(2).innerHTML = `<span style="${s.score < -50 ? 'color:red; font-weight:bold;' : ''}">${s.score.toFixed(2)}</span>`;
            });
        }

        document.querySelectorAll("#scoreTable th").forEach(th => {
            th.addEventListener("click", () => {
                const field = th.getAttribute("data-sort");
                if (!field) return;
                if (currentSort.field === field) {
                    currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.field = field;
                    currentSort.order = 'asc';
                }
                renderTable(currentStudents);
            });
        });

        document.getElementById("searchBtn").onclick = () => {
            const searchId = document.getElementById("searchId").value.trim();
            const filtered = searchId ? currentStudents.filter(s => s.id.includes(searchId)) : currentStudents;
            renderTable(filtered);
        };
        document.getElementById("resetBtn").onclick = () => {
            document.getElementById("searchId").value = "";
            renderTable(currentStudents);
        };
        loadData();
    </script>
</body>
</html>
